apiVersion: apps/v1
kind: Deployment

metadata:
  name: bankapp-deploy
  namespace: bankapp-namespace
  labels:
    app: bankapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bankapp

  template:
    metadata:
      labels:
        app: bankapp

    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.28
        command:
        - sh
        - -c
        - >
          until nc -z mysql-0.mysql-headless 3306;
          do
            echo "Waiting for MySQL...";
            sleep 2;
          done

      containers:
      - name: bankapp
        image: shamel1012/springboot-bankapp:latest

        ports:
        - containerPort: 8080

        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: bankapp-config
              key: SPRING_DATASOURCE_URL

        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: bankapp-config
              key: SPRING_DATASOURCE_USERNAME

        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: bankapp-config
              key: MYSQL_DATABASE

        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: SPRING_DATASOURCE_PASSWORD
